<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meno spese</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#12302B; --muted:#56706A; --line:#D3DDD8;
  --ok:#1E7F5C; --okbg:#CDE8DC; --warn:#B07A00; --warnbg:#F6E3B0; --bad:#C23B2E; --badbg:#F4CDC8;
  --accent:#1B4FD6; --accent-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1A18; --surface:#172421; --ink:#E6EFEC; --muted:#93A8A2; --line:#28403A;
    --ok:#4CC38F; --okbg:#1B4A39; --warn:#F0B63A; --warnbg:#4F3E10; --bad:#F07268; --badbg:#5A2723;
    --accent:#7FA2FF; --accent-ink:#0F1A18;
  }
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px 16px 64px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px}
nav button{flex:1;border:0;background:transparent;padding:10px 2px;font-size:.85rem;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:1.15rem;margin-bottom:12px}
h3{font-size:1rem;margin:20px 0 8px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.mnav strong{text-transform:capitalize;font-size:1.15rem}
.nbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:1.3rem;line-height:1}
.hero{padding:8px 0 4px}
.hero .label{color:var(--muted);font-size:1.05rem}
.hero .big{font-size:clamp(64px,22vw,112px);font-weight:800;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.hero .big.ok{color:var(--ok)} .hero .big.warn{color:var(--warn)} .hero .big.bad{color:var(--bad)}
.hero .sub{color:var(--muted);margin:0}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;margin:20px 0 6px}
.cell{aspect-ratio:1;border-radius:6px;font-size:.72rem;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;border:1px solid transparent}
.cell.future{border-color:var(--line);color:var(--muted)}
.cell.none,.cell.ok{background:var(--okbg);color:var(--ok)}
.cell.warn{background:var(--warnbg);color:var(--warn)}
.cell.bad{background:var(--badbg);color:var(--bad)}
.cell.today{font-weight:800;text-decoration:underline}
button.cell{cursor:pointer;font:inherit;font-size:.72rem;padding:0;background:transparent}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.legend{color:var(--muted);font-size:.85rem;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1rem}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:12px;font-weight:700;cursor:pointer;margin-top:4px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.msg{padding:10px 12px;border-radius:10px;background:var(--badbg);color:var(--bad);margin-bottom:12px;font-size:.95rem}
.note{color:var(--muted);font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.cat{margin-bottom:14px}
.cat .top{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.exp{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp .what{flex:1;min-width:0}
.exp .what small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .amt{font-weight:700;font-variant-numeric:tabular-nums}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;color:var(--ink);font-size:1rem;margin:0}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.check.done span{color:var(--muted);text-decoration:line-through}
.progress{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:600}
ul.rules{padding-left:20px;margin:0}
ul.rules li{margin-bottom:8px}
.chart{position:relative;height:120px;display:flex;align-items:flex-end;gap:4px;margin:8px 0 26px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}
.chart .b{width:100%;border-radius:4px 4px 0 0;background:var(--ok)}
.chart .b.over{background:var(--bad)}
.chart .m{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted)}
.chart .line{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.45;pointer-events:none}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.mrow:first-child{border-top:0}
.mrow .mn{text-transform:capitalize}
.mrow .mn em{font-style:normal;font-size:.8rem;color:var(--muted);margin-left:6px}
.mrow .d{font-size:.9rem;min-width:88px;text-align:right}
.d.ok{color:var(--ok)} .d.bad{color:var(--bad)} .d.mute{color:var(--muted)}
.daybar{position:sticky;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.daybar span{font-size:.9rem;font-weight:600;text-transform:capitalize}
.daybar .nbtn{width:36px;height:36px}
.catb{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;margin-bottom:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{width:100%;max-width:420px;margin:0}
</style>
</head>
<body>
<main id="app"></main>
<script>
const PAYS=['Contanti','PayPal','Carta'];
const CATS=['Casa','Spesa','Trasporti','Uscite e svago','Abbonamenti','Salute','Altro'];
const PLAN=[
 {t:'Settimana 1: guarda dove vanno i soldi',items:[
  ['a1','Segna ogni spesa per 7 giorni, anche i piccoli acquisti'],
  ['a2','Elenca abbonamenti e addebiti ricorrenti'],
  ['a3','Imposta entrate e obiettivo di risparmio nell’app']]},
 {t:'Settimana 2: taglia il superfluo',items:[
  ['b1','Disdici o riduci almeno un abbonamento che usi poco'],
  ['b2','Confronta bollette, telefonia e assicurazioni'],
  ['b3','Usa la regola delle 24 ore per gli acquisti non essenziali sopra 30 €']]},
 {t:'Settimana 3: sposta i soldi prima di spenderli',items:[
  ['c1','Metti da parte l’obiettivo appena arriva l’entrata, con un bonifico automatico'],
  ['c2','Fai la spesa con la lista e riduci i pasti fuori'],
  ['c3','Fai una settimana in cui compri solo l’essenziale']]},
 {t:'Settimana 4: verifica e correggi',items:[
  ['d1','Confronta le spese reali con il budget, categoria per categoria'],
  ['d2','Abbassa del 10% il budget della categoria più alta'],
  ['d3','Fissa l’obiettivo del mese prossimo']]}
];
const MI=['G','F','M','A','M','G','L','A','S','O','N','D'];
let state={income:0,goal:0,expenses:[],plan:{}};
let tab='oggi',msg='',sel=null,editId=null,vy=0,vm=0,ay=0,routeEdit=null,catFilter=null,msub='auto',fixEdit=null,vopen=null;
const app=document.getElementById('app');

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur0=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur2=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const num=s=>parseFloat(String(s).replace(',','.'));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mlabel=(y,m)=>new Date(y,m,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
const mname=m=>new Date(2000,m,1).toLocaleDateString('it-IT',{month:'long'});

/* ---------- utente, salvataggio su CSV (via server) e tracciamento ---------- */
const UKEY='meno-spese-utente';
const SID=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));
const DEV=/Mobi|Android|iPhone/i.test(navigator.userAgent)?'mobile':'desktop';
let user=null,saveOk=null,timer=null,inflight=false,pending=false,pendSilent=true,lastAct=Date.now(),hb=null;
function getUser(){try{const u=JSON.parse(localStorage.getItem(UKEY));if(u&&u.nome&&u.cognome)return u;}catch(e){}return null;}
function askUser(){
  return new Promise(resolve=>{
    const ov=document.createElement('div');ov.className='ov';
    ov.innerHTML=`<div class="card dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">Benvenuto in Meno spese</h2>
    <p class="note" style="margin-top:0">Prima di iniziare dimmi come ti chiami: serve solo a riconoscerti durante il test. Non c’è nessuna password. L’app registra come la usi (schede aperte e operazioni, senza importi).</p>
    <div class="msg" id="uerr" role="alert" hidden></div>
    <label>Nome<input id="unome" maxlength="40" autocomplete="given-name" autocapitalize="words"></label>
    <label>Cognome<input id="ucog" maxlength="40" autocomplete="family-name" autocapitalize="words"></label>
    <button class="btn" id="uok">Continua</button></div>`;
    document.body.appendChild(ov);
    const n=ov.querySelector('#unome'),c=ov.querySelector('#ucog'),er=ov.querySelector('#uerr');
    const go=()=>{
      const a=n.value.replace(/\s+/g,' ').trim(),b=c.value.replace(/\s+/g,' ').trim();
      if(!a||!b){er.textContent='Inserisci sia il nome sia il cognome.';er.hidden=false;return;}
      ov.remove();resolve({nome:a,cognome:b});
    };
    ov.querySelector('#uok').onclick=go;
    ov.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    n.focus();
  });
}
/* ---------- archivio locale: i "file CSV" vivono nel browser (IndexedDB), nessun server ---------- */
// Incolla qui l’indirizzo (…/exec) dell’app web Google Apps Script. Se resta vuoto, nessun dato viene inviato.
const SHEET_URL='https://script.google.com/macros/s/AKfycbxjeEIWqRjCKBrjKi7juW86XEeGp-QXy_MVT6t-Skpxabk-qOlxNbQHo49qHlL0VdIxwQ/exec';
const DB=(()=>{
const SEP=',';
const esc=(v,raw)=>{let s=v==null?'':String(v);if(!raw&&/^[=+\-@\t\r]/.test(s))s="'"+s;return s.includes(SEP)||/["\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const unpre=s=>s.replace(/^'(?=[=+\-@\t\r])/,'');
function parse(t){
  const rs=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===SEP){r.push(f);f='';}
    else if(c==='\n'){r.push(f);rs.push(r);r=[];f='';}
    else if(c!=='\r')f+=c;
  }
  if(f!==''||r.length){r.push(f);rs.push(r);}
  return rs;
}
const rows=(text,cols,nb)=>{const d=parse(text);if(!d.length)return[];const h=d[0];return d.slice(1).filter(r=>r.length>1||r[0]).map(r=>{const o={};cols.forEach(c=>{const j=h.indexOf(c),v=j<0?'':r[j]||'';o[c]=nb.has(c)?v:unpre(v);});return o;});};
const toCSV=(cols,rs,nb)=>[cols.join(SEP),...rs.map(r=>cols.map(c=>esc(r[c],nb.has(c))).join(SEP))].join('\n')+'\n';
/* Ogni riga: user_id + user_name, created_at, updated_at, deleted_at (eliminazione "soft").
   Tipi: S stringa sempre presente, s stringa opzionale, n numero, b booleano */
const toCell=(t,v)=>v==null||v===''?'':t==='n'?(isFinite(Number(v))?String(Number(v)):''):t==='b'?(v?'1':'0'):String(v);
const fromCell=(t,s)=>t==='S'?s:s===''?undefined:t==='n'?Number(s):t==='b'?s==='1':s;
const cellsOf=(F,o)=>{const c={};for(const k in F)c[k]=toCell(F[k],o[k]);return c;};
const T=[];
const list=(file,entity,src,F,label)=>T.push({file,entity,idCol:'id',F,label,
  extract:s=>(Array.isArray(s[src])?s[src]:[]).filter(o=>o&&o.id!=null).map(o=>({id:String(o.id),cells:cellsOf(F,o)})),
  inject:(s,id,v)=>(s[src]=s[src]||[]).push({id:Number(id),...v})});
list('expenses.csv','expense','expenses',{date:'S',amount:'n',cat:'S',note:'S',people:'n',total:'n',km:'n',cons:'n',price:'n',fsplit:'b',pay:'s',rb:'s',rbamt:'n',refuel:'b',extra:'b',xd:'s',veh:'n'},c=>c.cat);
list('vehicles.csv','vehicle','veh',{name:'S',type:'S',cons:'n',price:'n',ins:'s',insMo:'n',tax:'s',insSusp:'s'},c=>c.type);
list('routes.csv','route','routes',{name:'S',km:'n',days:'n',rt:'b',vid:'n'},()=>'');
list('fixed_costs.csv','fixed_cost','fixed',{c:'S',name:'S',amt:'n',v:'n'},c=>c.c);
list('ledger_moves.csv','ledger_move','entries',{date:'S',desc:'S',amt:'n',m:'S'},c=>c.m);
list('paypal_moves.csv','paypal_move','pp',{date:'S',desc:'S',amt:'n'},()=>'');
const SET=['income','goal','lastPay','car','mainVeh','ppReal','realB','realC'],QUIET=['lastPay','car'];
T.push({file:'settings.csv',entity:'setting',idCol:'key',F:{value:'s'},label:(c,id)=>id,
  extract:s=>SET.filter(k=>s[k]!==undefined).map(k=>({id:k,quiet:QUIET.includes(k),cells:{value:JSON.stringify(s[k])}})),
  inject:(s,id,v)=>{try{s[id]=JSON.parse(v.value);}catch(e){}}});
T.push({file:'plan_progress.csv',entity:'plan_item',idCol:'item',F:{done:'b'},label:(c,id)=>id+(c.done==='1'?' on':' off'),
  extract:s=>Object.keys(s.plan||{}).map(k=>({id:k,cells:{done:s.plan[k]?'1':'0'}})),
  inject:(s,id,v)=>{(s.plan=s.plan||{})[id]=v.done===true;}});
T.forEach(t=>{t.cols=['user_id','user_name',t.idCol,...Object.keys(t.F),'created_at','updated_at','deleted_at'];t.nb=new Set(Object.keys(t.F).filter(k=>'nb'.includes(t.F[k])));t.rows=[];});
const UC=['user_id','nome','cognome','first_seen','last_seen'],EC=['ts','user_id','user_name','session_id','event','entity','entity_id','detail','device'],NONE=new Set(),EV=new Set(['tab_view','heartbeat','user_switch']);
let IDB=null,users=[],evText=EC.join(SEP)+'\n';
const get=k=>new Promise((res,rej)=>{const q=IDB.transaction('csv').objectStore('csv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const set=(k,v)=>new Promise((res,rej)=>{const tx=IDB.transaction('csv','readwrite');tx.objectStore('csv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});
const ready=(async()=>{
  IDB=await new Promise((res,rej)=>{const r=indexedDB.open('meno-spese-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('csv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  for(const t of T)t.rows=rows(await get(t.file)||'',t.cols,t.nb);
  users=rows(await get('users.csv')||'',UC,NONE);
  evText=(await get('events.csv'))||evText;
  try{pend=JSON.parse((await get('pending'))||'[]');}catch(e){pend=[];}
})();
ready.catch(()=>{});
let pend=[],sending=false;
function queue(e){if(!SHEET_URL)return;pend.push(e);set('pending',JSON.stringify(pend)).catch(()=>{});}
async function push(){
  if(!SHEET_URL||sending||!pend.length)return;
  sending=true;const batch=pend.slice(0,300);
  try{
    await fetch(SHEET_URL,{method:'POST',mode:'no-cors',keepalive:batch.length<80,body:JSON.stringify({events:batch})});
    pend=pend.slice(batch.length);set('pending',JSON.stringify(pend)).catch(()=>{});
  }catch(e){}
  sending=false;
}
if(SHEET_URL){setInterval(push,10000);addEventListener('pagehide',push);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')push();});ready.then(push).catch(()=>{});}
const clean=x=>String(x||'').replace(/\s+/g,' ').trim().slice(0,40);
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||s.toLowerCase().split('').map(c=>c.charCodeAt(0).toString(16)).join('').slice(0,12);
function who(b){
  const nome=clean(b.nome),cognome=clean(b.cognome);
  if(!nome||!cognome)throw new Error('nome e cognome obbligatori');
  const id=slug(nome)+'-'+slug(cognome),now=new Date().toISOString();
  let u=users.find(x=>x.user_id===id);
  if(!u){u={user_id:id,nome,cognome,first_seen:now,last_seen:now};users.push(u);}else u.last_seen=now;
  set('users.csv',toCSV(UC,users,NONE)).catch(()=>{});
  return u;
}
function log(u,b,event,entity='',eid='',detail='',ts=new Date().toISOString()){
  const e={ts,user_id:u.user_id,user_name:u.nome+' '+u.cognome,session_id:/^[\w-]{4,64}$/.test(String(b.session_id||''))?b.session_id:'na',event,entity,entity_id:eid,detail:String(detail).slice(0,60),device:b.device==='mobile'?'mobile':'desktop'};
  evText+=EC.map(c=>esc(e[c])).join(SEP)+'\n';
  set('events.csv',evText).catch(()=>{});
  queue(e);
}
function build(uid){
  const s={income:0,goal:0,expenses:[],plan:{}};let any=false;
  for(const t of T)for(const r of t.rows){
    if(r.user_id!==uid||r.deleted_at)continue;
    any=true;const v={};
    for(const k in t.F){const x=fromCell(t.F[k],r[k]);if(x!==undefined)v[k]=x;}
    t.inject(s,r[t.idCol],v);
  }
  return any?s:null;
}
// Confronta lo stato dell'app con i "CSV" dell'utente e registra ogni aggiunta/modifica/eliminazione
async function sync(u,b){
  const s=b.state;
  if(!s||!Array.isArray(s.expenses))throw new Error('stato non valido');
  const now=new Date().toISOString(),name=u.nome+' '+u.cognome,ws=[];let n=0;
  for(const t of T){
    const inc=t.extract(s),mine=new Map(),seen=new Set(),fk=Object.keys(t.F);let ch=false;
    t.rows.forEach(r=>{if(r.user_id===u.user_id)mine.set(r[t.idCol],r);});
    const ev=(a,id,c,q)=>{n++;if(!b.silent&&!q)log(u,b,t.entity+'_'+a,t.entity,id,t.label(c,id),now);};
    for(const i of inc){
      if(seen.has(i.id))continue;seen.add(i.id);
      const x=mine.get(i.id),c=i.cells;
      if(!x){
        const r={user_id:u.user_id,user_name:name,[t.idCol]:i.id,created_at:now,updated_at:now,deleted_at:''};
        fk.forEach(k=>r[k]=c[k]);t.rows.push(r);ch=true;ev('add',i.id,c,i.quiet);
      }else if(x.deleted_at||fk.some(k=>x[k]!==c[k])){
        const was=x.deleted_at;fk.forEach(k=>x[k]=c[k]);x.updated_at=now;x.deleted_at='';ch=true;ev(was?'add':'update',i.id,c,i.quiet);
      }
    }
    mine.forEach((x,id)=>{if(!seen.has(id)&&!x.deleted_at){x.deleted_at=x.updated_at=now;ch=true;ev('delete',id,x);}});
    if(ch)ws.push(set(t.file,toCSV(t.cols,t.rows,t.nb)));
  }
  await Promise.all(ws);
  return{ok:true,ops:n};
}
async function handle(p,b){
  const u=who(b);
  if(p==='/api/load'){log(u,b,'app_open');return{state:build(u.user_id)};}
  if(p==='/api/sync')return sync(u,b);
  if(p==='/api/event'){

}

/* ---------- calcoli ---------- */
function calc(){
  const now=new Date(),y=vy,m=vm;
  const isCur=y===now.getFullYear()&&m===now.getMonth();
  const past=y*12+m<now.getFullYear()*12+now.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const day=isCur?now.getDate():past?dim:0;
  const daysLeft=isCur?dim-day+1:0;
  const mk=y+'-'+pad(m+1),today=dkey(now);
  const exp=state.expenses.filter(e=>e.date.startsWith(mk));
  const spent=exp.reduce((a,e)=>a+e.amount,0);
  const spentToday=isCur?exp.filter(e=>e.date===today).reduce((a,e)=>a+e.amount,0):0;
  const budget=budgetOf();
  const allowance=isCur?(budget-(spent-spentToday))/daysLeft:0;
  const perDay=Array(dim+1).fill(0);
  exp.forEach(e=>{perDay[parseInt(e.date.slice(8),10)]+=e.amount;});
  return{y,m,mk,isCur,past,dim,day,daysLeft,exp,spent,spentToday,budget,allowance,leftToday:allowance-spentToday,perDay,proj:day>0?spent/day*dim:0};
}

const routeCost=r=>{const v=vById(r.vid);return v.cons>0&&v.price>0?r.km*(r.rt?2:1)/v.cons*v.price*r.days*52/12:0;};
const routesTot=()=>(state.routes||[]).reduce((a,r)=>a+routeCost(r),0);
const fixedTot=()=>(state.fixed||[]).reduce((a,f)=>a+f.amt,0)+routesTot();
const budgetOf=()=>Math.max(0,state.income-state.goal-fixedTot());
const vehs=()=>{if(!state.veh||!state.veh.length){const k=state.car||{cons:0,price:0};state.veh=[{id:1,name:'Auto',type:'auto',cons:k.cons||0,price:k.price||0}];state.mainVeh=1;}return state.veh;};
const vById=id=>vehs().find(v=>v.id===id)||vehs().find(v=>v.id===state.mainVeh)||vehs()[0];
const car=()=>{const v=vById(state.mainVeh);return{cons:v.cons||0,price:v.price||0};};

const fmtCons=c=>`${n1(c)} km/l · ${n1(100/c)} l/100 km`;
const l100v=v=>v>0?String(Math.round(100/v*100)/100).replace('.',','):'';
const fmtKm=k=>k.toLocaleString('it-IT',{maximumFractionDigits:1});

function sub(e){
  const p=[];
  if(e.note)p.push(esc(e.note));
  if(e.people>1)p.push(`diviso in ${e.people}, totale ${eur2(e.total)}${e.rbamt>=0?`, rimborsato ${eur2(e.rbamt)}`:''}${e.fsplit?`, ogni amico ${eur2(Math.min(fuel(e),e.total)/e.people)}`:''}`);
  if(e.refuel)p.push('rifornimento');

  return p.join(' – ');

/* ---------- schede ---------- */
function viewOggi(){
  const c=calc();
  if(sel===null||sel>c.dim)sel=c.isCur?c.day:1;
  if(c.budget<=0)return `<p class="note">Imposta entrate e obiettivo: il budget del mese si calcola da solo.</p>`+setupCard('Il tuo mese');
  let hero;
  if(c.isCur){
    let cls,label,big,sub;
    if(c.leftToday>=0){
      cls=c.leftToday<c.allowance*0.2?'warn':'ok';
      label='Oggi puoi ancora spendere';big=eur0(c.leftToday);
      sub=`Il limite di oggi è ${eur0(Math.max(0,c.allowance))}, calcolato su ciò che resta del mese.`;
    }else{
      cls='bad';label='Oggi sei oltre il limite di';big=eur0(-c.leftToday);
      sub=c.daysLeft>1?`Domani il limite scende a ${eur0(Math.max(0,(c.budget-c.spent)/(c.daysLeft-1)))}.`:'Il mese è finito: riparti dal prossimo.';
    }
    hero=`<section class="hero"><div class="label">${label}</div><div class="big ${cls}">${big}</div><p class="sub">${sub}</p></section>`;
  }else{
    const over=c.spent>c.budget;
    const sub=c.past?(c.spent===0?'Nessuna spesa registrata in questo mese.':over?`${eur0(c.spent-c.budget)} sopra il budget di ${eur0(c.budget)}.`:`${eur0(c.budget-c.spent)} sotto il budget di ${eur0(c.budget)}.`):'Mese futuro: puoi pianificare le spese giorno per giorno.';
    hero=`<section class="hero"><div class="label">Speso in questo mese</div><div class="big ${over?'bad':'ok'}">${eur0(c.spent)}</div><p class="sub">${sub}</p></section>`;
  }
  const base=c.budget/c.dim;
  let cells='';
  for(let d=1;d<=c.dim;d++){
    const s=c.perDay[d];
    let k;
    if(d>c.day&&s===0)k='future';
    else k=s===0?'none':s<=base?'ok':s<=base*1.5?'warn':'bad';
    cells+=`<button class="cell ${k}${c.isCur&&d===c.day?' today':''}${d===sel?' sel':''}" data-act="pick" data-day="${d}" aria-pressed="${d===sel}" aria-label="Giorno ${d}: ${eur2(s)}" title="${d}: ${eur2(s)}">${d}</button>`;
  }
  let summary='';
  if(c.isCur){
    const diff=c.budget-c.proj;
    const projTxt=c.spent===0?'Aggiungi la prima spesa per vedere la proiezione del mese.':
      diff>=0?`Con questo ritmo chiudi il mese a ${eur0(c.proj)}: ${eur0(diff)} sotto il budget.`:
      `Con questo ritmo chiudi il mese a ${eur0(c.proj)}: ${eur0(-diff)} sopra il budget.`;
    summary=`<div class="card"><p style="margin:0 0 4px">Hai speso <strong>${eur0(c.spent)}</strong> su ${eur0(c.budget)}. Restano ${eur0(Math.max(0,c.budget-c.spent))} per ${c.daysLeft} ${c.daysLeft===1?'giorno':'giorni'}.</p><p class="note" style="margin:0">${projTxt}</p></div>`;
  }
  return monthNav(c)+hero+
  `<div class="strip" role="group" aria-label="Giorni del mese">${cells}</div>
  <p class="legend">Tocca un giorno per vedere, aggiungere o modificare le sue spese. Verde sotto la media, giallo poco sopra, rosso molto sopra.</p>`+
  summary+dayPanel(c);
}

  }).join('');

    const l=Object.entries(tot).sort((a,b)=>b[1]-a[1]);
    const top=l[0],p=Math.round(top[1]/total*100);

    let abb='';
    if(tot['Abbonamenti']>0){const a=tot['Abbonamenti']/tracked;abb=` Gli abbonamenti pesano in media ${eur0(a)} al mese: ${eur0(a*12)} in un anno.`;}
    cats=`<div class="card"><h2>Dove vanno i soldi nell’anno</h2>${bars}
    <p class="note" style="margin:8px 0 0">La voce più pesante è ${esc(top[0])}: ${p}% delle spese. Tagliarla del 10% vale circa ${eur0(cut)} in un anno.${abb}</p></div>`;
  }
  const sum=`<div class="card"><p style="margin:0">Hai speso <strong>${eur0(total)}</strong> nel ${ay}, in ${tracked} ${tracked===1?'mese':'mesi'} con spese registrate.</p></div>`;
  return nav+hero+chart+sum+list+cats;
}

  ${scadCard(vo)}${fixedCard('Auto',vo.id)}${refuelV(vo)}
  <div class="card"><h2>Spese straordinarie: ${eur2(ex.reduce((a,e)=>a+e.amount,0))}</h2>${ex.map(e=>`<div class="exp"><div class="what">${esc(e.xd||e.cat)}<small>${dfmt(e.date)}${e.pay?' – con '+e.pay:''}</small></div><span class="amt">${eur2(e.amount)}</span></div>`).join('')||'<p class="note" style="margin:0">Attiva “Spesa straordinaria del veicolo” quando registri una spesa.</p>'}</div>`;
}

function scadSt(d,f){
  const td=new Date();td.setHours(0,0,0,0);
  const n=Math.round((new Date(d+'T00:00:00')-td)/864e5),g=Math.abs(n)===1?'giorno':'giorni';
  const c=n<=0?'var(--bad)':n<=30?'var(--warn)':'var(--ok)';
  return `<span style="color:${c}">${dfmt(d)}, ${n<0?`scadut${f} da ${-n} ${g}`:n===0?'scade oggi':`tra ${n} ${g}`}</span>`;
}
function scadLine(v){
  const na='<span style="color:var(--muted)">da inserire</span>';
  const a=v.insSusp?'<span style="color:var(--muted)">sospesa</span>':(v.ins?scadSt(v.ins,'a'):na);
  return `Assicurazione: ${a}<br>Bollo: ${v.tax?scadSt(v.tax,'o'):na}`;
}
function addM(d,mo){
  const [y,m,dd]=d.split('-').map(Number),tm=m-1+mo,ty=y+Math.floor(tm/12),mm=tm%12;
  const x=new Date(ty,mm,Math.min(dd,new Date(ty,mm+1,0).getDate()));
  return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
}
function nxt(d,mo){
  const t=new Date();t.setHours(0,0,0,0);
  const [y,m,dd]=d.split('-').map(Number);
  let i=0,x;
  do{const tm=m-1+mo*i,ty=y+Math.floor(tm/12),mm=((tm%12)+12)%12;x=new Date(ty,mm,Math.min(dd,new Date(ty,mm+1,0).getDate()));i++;}while(x<t&&i<600);
  return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
}
function scadCard(vo){
  const td=new Date();td.setHours(0,0,0,0);
  const st=(d,mo)=>{
    if(!d)return '';
    const n=Math.round((new Date(d+'T00:00:00')-td)/864e5),g=Math.abs(n)===1?'giorno':'giorni';
    return n<0?`<span style="color:var(--bad)">scaduta da ${-n} ${g}</span>`:n===0?'<span style="color:var(--bad)">scade oggi</span>':`<span style="color:${n<=30?'var(--warn)':'var(--ok)'}">scade tra ${n} ${g}</span>`;
  };
  return `<div class="card"><h2>Scadenze</h2><p class="note" style="margin-top:0">Inserisci la scadenza. Se non è stata pagata resta rossa; con “Segna come pagata” passa alla successiva.</p>
  <label>Assicurazione, scadenza<input id="vins" type="date" value="${vo.ins||''}"></label><p class="note" style="margin:-6px 0 10px">${vo.insSusp?`Sospesa dal ${dfmt(vo.insSusp)}. Alla ripresa la scadenza si sposta avanti dei giorni di sospensione.`:(vo.ins?dfmt(vo.ins)+': ':'')+st(vo.ins)+(vo.ins?` <button class="link" data-act="scadpaid" data-id="${vo.id}" data-k="ins">Segna come pagata</button>`:'')}</p>
  <label>Durata assicurazione (mesi)<input id="vinsmo" inputmode="numeric" value="${vo.insMo||6}"></label>
  ${vo.ins?`<label>${vo.insSusp?'Data di ripresa':'Data di sospensione'}<input id="vsusd" type="date" value="${dkey(new Date())}"></label><button class="btn" style="background:var(--muted);margin-bottom:14px" data-act="${vo.insSusp?'insres':'inssus'}" data-id="${vo.id}">${vo.insSusp?'Riprendi assicurazione':'Sospendi assicurazione'}</button>`:''}
  <label>Bollo (ogni anno), scadenza<input id="vtax" type="date" value="${vo.tax||''}"></label><p class="note" style="margin:-6px 0 10px">${vo.tax?dfmt(vo.tax)+': ':''}${st(vo.tax)}${vo.tax?` <button class="link" data-act="scadpaid" data-id="${vo.id}" data-k="tax">Segna come pagato</button>`:''}</p>
  <button class="btn" data-act="saveScad" data-id="${vo.id}">Salva scadenze</button></div>`;
}

function viewTragitti(){
  const R=state.routes||[],V=vehs(),re=routeEdit?R.find(x=>x.id===routeEdit):null;
  const kd=r=>r.km*(r.rt?2:1),wk=r=>r.days*52/12;
  const rows=R.map(r=>{const c=routeCost(r);return `<div class="exp"><div class="what">${esc(r.name)}<small>${esc(vById(r.vid).name)}, ${fmtKm(kd(r))} km al giorno, ${r.days} giorni a settimana${c>0?`, circa ${eur0(c)} al mese`:''}</small></div><button class="link" data-act="redit" data-id="${r.id}">Modifica</button><button class="link" data-act="rdel" data-id="${r.id}">Elimina</button></div>`;}).join('');
  const tm=routesTot(),tl=R.reduce((a,r)=>{const v=vById(r.vid);return a+(v.cons>0?kd(r)/v.cons*wk(r):0);},0);
  return `<div class="card"><h2>Tragitti fissi</h2>${rows||'<p class="note" style="margin:0">Aggiungi un tragitto abituale, ad esempio casa e lavoro.</p>'}${R.length&&tm>0?`<p class="note" style="margin:8px 0 0">Stima totale: ${eur0(tm)} al mese e ${eur0(tm*12)} all’anno, circa ${n1(tl)} litri al mese.</p>`:''}</div>
  <div class="card"><h3 style="margin:0 0 8px">${re?'Modifica tragitto':'Nuovo tragitto'}</h3><div class="msg" id="rerr" role="alert" hidden></div>
  <label>Nome<input id="rname" maxlength="30" placeholder="Casa – lavoro" value="${re?esc(re.name):''}"></label>
  <label>Veicolo<select id="rveh">${V.map(v=>`<option value="${v.id}"${(re?vById(re.vid).id:state.mainVeh)===v.id?' selected':''}>${esc(v.name)}</option>`).join('')}</select></label>
  <div class="row"><label>Km di andata<input id="rkm" inputmode="decimal" placeholder="12" value="${re?fv(re.km):''}"></label><label>Giorni a settimana<input id="rdays" inputmode="numeric" placeholder="5" value="${re?re.days:5}"></label></div>
  <label class="check" style="border:0;padding:4px 0 10px"><input type="checkbox" id="rrt" ${!re||re.rt?'checked':''}><span>Andata e ritorno</span></label>
  <button class="btn" data-act="radd">${re?'Salva modifica':'Aggiungi tragitto'}</button></div>`;
}

function viewMensili(){
  const ft=fixedTot(),b=Math.max(0,state.income-state.goal);
  const sw=`<nav>${[['auto','Veicoli'],['tr','Tragitti'],['abb','Abbonamenti']].map(([v,l])=>`<button data-act="ms" data-v="${v}" ${msub===v?'aria-current="true"':''}>${l}</button>`).join('')}</nav>`;
  const head=b>0?`<div class="card"><p style="margin:0">Spese fisse: <strong>${eur0(ft)}</strong> al mese${routesTot()>0?`, di cui ${eur0(routesTot())} di carburante dei tragitti`:''}. Il budget per le altre spese scende a <strong>${eur0(Math.max(0,b-ft))}</strong> e abbassa il limite giornaliero.</p></div>`:'';
  return sw+head+(msub==='auto'?viewVeicoli():msub==='tr'?viewTragitti():fixedCard('Abbonamenti'));
}

function viewPiano(){
  const all=PLAN.flatMap(w=>w.items),done=all.filter(i=>state.plan[i[0]]).length;

  return `<div class="progress"><span>Piano di 30 giorni</span><span>${done} di ${all.length}</span></div>
  <div class="bar" style="margin-bottom:8px"><i style="width:${Math.round(done/all.length*100)}%"></i></div>
  ${weeks}
  <h3>Regole veloci</h3><div class="card"><ul class="rules">
  <li>Prima risparmi, poi spendi: l’obiettivo esce appena arriva l’entrata.</li>

  <h3>Backup</h3><div class="card"><p class="note" style="margin-top:0">Copia questo testo e incollalo in un posto sicuro, ad esempio nelle Note. Per ripristinare i dati, incolla qui il testo salvato e premi Ripristina.</p>
  <textarea id="bk" rows="4" style="display:block;width:100%;margin:8px 0 12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:inherit;font-size:.8rem">${esc(JSON.stringify(state))}</textarea>

  <h3>I tuoi dati</h3><div class="card"><p class="note" style="margin-top:0">I dati sono salvati in questo browser come file CSV. Se cancelli i dati del browser vanno persi: esportali ogni tanto. Il tuo utilizzo dell’app (quando la apri, quali schede usi, tipo di operazione e categoria, senza importi né descrizioni) viene inviato a chi gestisce il test.</p><div class="row"><button class="btn" data-act="expEvents">Dati d’uso</button><button class="btn" data-act="expAll">Tutti i dati</button></div></div>`;
}

function render(){
  const tabs=[['oggi','Oggi'],['spese','Spese'],['anno','Anno'],['auto','Mensili'],['conti','Conti'],['piano','Piano']];
  const v=tab==='oggi'?viewOggi():tab==='spese'?viewSpese():tab==='anno'?viewAnno():tab==='auto'?viewMensili():tab==='conti'?viewConti():viewPiano();
  app.innerHTML=`<nav>${tabs.map(([k,n])=>`<button data-tab="${k}" ${tab===k?'aria-current="true"':''}>${n}</button>`).join('')}</nav>${v}<p class="note" id="saveStatus"></p>`;
  showStatus();
  updQuota();
}

/* ---------- eventi ---------- */
function shiftM(d){
  let m=vm+d,y=vy;
  if(m<0){m=11;y--;}else if(m>11){m=0;y++;}
  vy=y;vm=m;sel=null;editId=null;
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  msg='';
  if(t.dataset.tab){tab=t.dataset.tab;catFilter=null;track('tab_view',tab);render();return;}
  const a=t.dataset.act;
  if(a==='saveSetup'){
    const inc=num(document.getElementById('inc').value),goal=num(document.getElementById('goal').value)||0;
    if(!(inc>0))msg='Inserisci le entrate mensili.';
    else if(goal<0||goal>=inc)msg='L’obiettivo deve essere minore delle entrate.';
    else{state.income=inc;state.goal=goal;save();}
    render();
  }else if(a==='add'){
    const amt=num(document.getElementById('amt').value);
    const er=document.getElementById('err');
    const dt=document.getElementById('dt').value;
    const pay=document.getElementById('pay').value,rb=document.getElementById('rb').value;state.lastPay=pay;
    const rf=document.getElementById('refuel').checked,ex=document.getElementById('extra').checked,xd=document.getElementById('xd').value.trim(),vh=parseInt(document.getElementById('vsel').value,10)||0;
    if(ex&&!xd){er.textContent='Scrivi che spesa straordinaria è.';er.hidden=false;return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){er.textContent='Scegli un giorno valido.';er.hidden=false;return;}
    const isSplit=document.getElementById('split').checked;
    const n=parseInt(document.getElementById('ppl').value,10);
    if(!(amt>0)){er.textContent='Inserisci un importo maggiore di zero.';er.hidden=false;return;}
    if(isSplit&&!(n>=2&&n<=50)){er.textContent='Indica in quante persone dividi, da 2 in su.';er.hidden=false;return;}
    const isTrip=document.getElementById('trip').checked;
    const km=num(document.getElementById('km').value),cons=num(document.getElementById('cons').value),price=num(document.getElementById('price').value);
    if(isTrip&&!(km>0)){er.textContent='Inserisci i km percorsi.';er.hidden=false;return;}
    if(isTrip&&cons>0&&price>0)state.car={cons,price};
    const cat=document.getElementById('cat').value,note=document.getElementById('note').value.trim();
    const total=Math.round(amt*100)/100;
    const fs=isSplit&&isTrip&&document.getElementById('fsplit').checked;
    if(fs&&!(cons>0&&price>0)){er.textContent='Per dividere solo il carburante servono consumo e prezzo del gasolio.';er.hidden=false;return;}
    const sh=fs?Math.min(km/cons*price,total):total;
    const rbA=isSplit?num(document.getElementById('rbamt').value):NaN;
    if(isSplit&&rbA>total){er.textContent='Il rimborso non può superare il totale.';er.hidden=false;return;}
    const mine=isSplit?(rbA>=0?Math.round((total-rbA)*100)/100:Math.round((total-(n-1)*sh/n)*100)/100):total;
    vy=parseInt(dt.slice(0,4),10);vm=parseInt(dt.slice(5,7),10)-1;sel=parseInt(dt.slice(8),10);
    const ed=editId&&state.expenses.find(x=>x.id===editId);
    if(ed){
      ed.date=dt;ed.amount=mine;ed.cat=cat;if(pay)ed.pay=pay;else delete ed.pay;if(isSplit&&rb)ed.rb=rb;else delete ed.rb;
      if(rbA>=0)ed.rbamt=rbA;else delete ed.rbamt;
      if(rf)ed.refuel=true;else delete ed.refuel;
      if(ex){ed.extra=true;ed.xd=xd;}else{delete ed.extra;delete ed.xd;}
      if(vh&&(rf||ex||isTrip))ed.veh=vh;else delete ed.veh;ed.note=note;if(fs)ed.fsplit=true;else delete ed.fsplit;
      if(isSplit){ed.people=n;ed.total=total;}else{delete ed.people;delete ed.total;}
      if(isTrip){ed.km=km;if(cons>0)ed.cons=cons;else delete ed.cons;if(price>0)ed.price=price;else delete ed.price;}else{delete ed.km;delete ed.cons;delete ed.price;}
      editId=null;
    }else{
      const x={id:Date.now(),date:dt,amount:mine,cat,note};
      if(isSplit){x.people=n;x.total=total;}
      if(isTrip){x.km=km;if(cons>0)x.cons=cons;if(price>0)x.price=price;}
      if(fs)x.fsplit=true;if(pay)x.pay=pay;if(isSplit&&rb)x.rb=rb;
      if(rbA>=0)x.rbamt=rbA;
      if(rf)x.refuel=true;
      if(ex){x.extra=true;x.xd=xd;}
      if(vh&&(rf||ex||isTrip))x.veh=vh;
      state.expenses.push(x);
    }
    save();render();
  }else if(a==='del'){
    if(String(editId)===t.dataset.id)editId=null;
    state.expenses=state.expenses.filter(x=>String(x.id)!==t.dataset.id);save();render();
  }else if(a==='pick'){
    sel=parseInt(t.dataset.day,10);editId=null;render();
    const dc=document.getElementById('daycard');if(dc)dc.scrollIntoView({block:'nearest'});
  }else if(a==='edit'){
    const x=state.expenses.find(z=>String(z.id)===t.dataset.id);
    if(x){
      editId=x.id;vy=parseInt(x.date.slice(0,4),10);vm=parseInt(x.date.slice(5,7),10)-1;sel=parseInt(x.date.slice(8),10);tab='oggi';render();
      const dc=document.getElementById('daycard');if(dc)dc.scrollIntoView({block:'center'});
    }
  }else if(a==='cancelEdit'){
    editId=null;render();
  }else if(a==='prevD'||a==='nextD'){
    const d=new Date(vy,vm,sel+(a==='nextD'?1:-1));
    vy=d.getFullYear();vm=d.getMonth();sel=d.getDate();editId=null;render();
  }else if(a==='vadd'){
    const nm=document.getElementById('vname').value.trim();
    if(!nm){const er=document.getElementById('verr');er.textContent='Scrivi il nome del veicolo.';er.hidden=false;return;}
    vehs();const id=Date.now();state.veh.push({id,name:nm,type:document.getElementById('vtype').value,cons:0,price:0});vopen=id;save();render();
  }else if(a==='vopen'){vopen=parseInt(t.dataset.id,10);render();
  }else if(a==='vmain'){state.mainVeh=parseInt(t.dataset.id,10);save();render();
  }else if(a==='vdel'){
    const id=parseInt(t.dataset.id,10);state.veh=vehs().filter(v=>v.id!==id);
    if(state.mainVeh===id)state.mainVeh=state.veh[0].id;
    if(vopen===id)vopen=null;save();render();
  }else if(a==='inssus'){
    const v=vById(parseInt(t.dataset.id,10)),d=document.getElementById('vsusd').value;
    if(d){v.insSusp=d;save();render();}
  }else if(a==='insres'){
    const v=vById(parseInt(t.dataset.id,10)),d=document.getElementById('vsusd').value;
    if(d&&v.insSusp&&v.ins){
      const days=Math.round((new Date(d+'T00:00:00')-new Date(v.insSusp+'T00:00:00'))/864e5);
      const x=new Date(v.ins+'T00:00:00');x.setDate(x.getDate()+Math.max(0,days));
      v.ins=x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
    }
    delete v.insSusp;save();render();
  }else if(a==='scadpaid'){
    const v=vById(parseInt(t.dataset.id,10)),k=t.dataset.k;
    if(v[k])v[k]=addM(v[k],k==='ins'?(v.insMo||6):12);
    save();render();
  }else if(a==='saveScad'){
    const v=vById(parseInt(t.dataset.id,10));
    v.ins=document.getElementById('vins').value||'';v.insMo=Math.max(1,Math.min(24,parseInt(document.getElementById('vinsmo').value,10)||6));v.tax=document.getElementById('vtax').value||'';save();render();
  }else if(a==='saveVeh'){
    const v=vById(parseInt(t.dataset.id,10));
    const nn=document.getElementById('vnm').value.trim();if(nn)v.name=nn;
    v.cons=num(document.getElementById('vcons').value)||0;v.price=num(document.getElementById('vprice').value)||0;save();render();
  }else if(a==='catf'){catFilter=t.dataset.c;render();window.scrollTo(0,0);
  }else if(a==='catback'){catFilter=null;render();
  }else if(a==='ms'){msub=t.dataset.v;fixEdit=null;track('tab_view','mensili/'+msub);render();
  }else if(a==='fadd'){
    const nm=document.getElementById('fname').value.trim(),am=num(document.getElementById('famt').value);
    if(!nm||!(am>0)){const er=document.getElementById('ferr');er.textContent='Inserisci nome e importo mensile.';er.hidden=false;return;}
    state.fixed=state.fixed||[];
    const f=fixEdit&&state.fixed.find(x=>x.id===fixEdit),v=Math.round(am*100)/100;
    if(f){f.name=nm;f.amt=v;fixEdit=null;}else state.fixed.push({id:Date.now(),c:t.dataset.c,name:nm,amt:v,v:t.dataset.v?parseInt(t.dataset.v,10):undefined});
    save();render();
  }else if(a==='fedit'){fixEdit=parseInt(t.dataset.id,10);render();
  }else if(a==='fdel'){state.fixed=(state.fixed||[]).filter(x=>String(x.id)!==t.dataset.id);if(String(fixEdit)===t.dataset.id)fixEdit=null;save();render();
  }else if(a==='cv'){cview=t.dataset.v;track('tab_view','conti/'+cview);render();
  }else if(a==='eadd'||a==='ppadd'){
    const p=a==='eadd'?'e':'p',dt2=document.getElementById(p+'dt').value,am=num(document.getElementById(p+'amt').value);
    const ds2=document.getElementById(p+'desc').value.trim(),k=document.getElementById(p+'k').value;
    if(!dt2||!(am>0)){const er=document.getElementById(p+'err');er.textContent='Inserisci giorno e importo maggiore di zero.';er.hidden=false;return;}
    const v=Math.round(am*100)/100;
    if(a==='eadd'){(state.entries=state.entries||[]).push({id:Date.now(),date:dt2,desc:ds2,amt:k.length>1?-v:v,m:k[0]});vy=parseInt(dt2.slice(0,4),10);vm=parseInt(dt2.slice(5,7),10)-1;}
    else(state.pp=state.pp||[]).push({id:Date.now(),date:dt2,desc:ds2,amt:k==='U'?-v:v});
    save();render();
  }else if(a==='edel'){state.entries=(state.entries||[]).filter(x=>String(x.id)!==t.dataset.id);save();render();
  }else if(a==='ppdel'){state.pp=(state.pp||[]).filter(x=>String(x.id)!==t.dataset.id);save();render();
  }else if(a==='ppreal'){const v=num(document.getElementById('ppreal').value);state[{P:'ppReal',B:'realB',C:'realC'}[t.dataset.k||'P']]=isNaN(v)?null:v;save();render();
  }else if(a==='radd'){
    const nm=document.getElementById('rname').value.trim(),km=num(document.getElementById('rkm').value);
    const dy=parseInt(document.getElementById('rdays').value,10),rt=document.getElementById('rrt').checked,rv=parseInt(document.getElementById('rveh').value,10);
    if(!nm||!(km>0)||!(dy>=1&&dy<=7)){const er=document.getElementById('rerr');er.textContent='Inserisci nome, km di andata e giorni a settimana (da 1 a 7).';er.hidden=false;return;}
    state.routes=state.routes||[];
    const r=routeEdit&&state.routes.find(x=>x.id===routeEdit);
    if(r){r.name=nm;r.km=km;r.days=dy;r.rt=rt;r.vid=rv;routeEdit=null;}else state.routes.push({id:Date.now(),name:nm,km,days:dy,rt,vid:rv});
    save();render();
  }else if(a==='redit'){routeEdit=parseInt(t.dataset.id,10);render();
  }else if(a==='rdel'){
    state.routes=(state.routes||[]).filter(x=>String(x.id)!==t.dataset.id);
    if(String(routeEdit)===t.dataset.id)routeEdit=null;
    save();render();
  }else if(a==='saveCar'){
    state.car={cons:num(document.getElementById('ccons').value)||0,price:num(document.getElementById('cprice').value)||0};
    save();render();
  }else if(a==='prevM'){shiftM(-1);render();
  }else if(a==='nextM'){shiftM(1);render();
  }else if(a==='nowM'){const n=new Date();vy=n.getFullYear();vm=n.getMonth();sel=null;editId=null;render();
  }else if(a==='prevY'){ay--;render();
  }else if(a==='nextY'){ay++;render();
  }else if(a==='nowY'){ay=new Date().getFullYear();render();
  }else if(a==='gotoM'){
    vy=ay;vm=parseInt(t.dataset.m,10);sel=null;editId=null;tab='oggi';render();window.scrollTo(0,0);
  }else if(a==='expEvents'){exportEvents();
  }else if(a==='expAll'){exportAll();
  }else if(a==='switchUser'){switchUser();
  }else if(a==='copyBk'){
    const ta=document.getElementById('bk');ta.select();
    try{navigator.clipboard.writeText(ta.value);}catch(e1){try{document.execCommand('copy');}catch(e2){}}
    t.textContent='Copiato';
  }else if(a==='restoreBk'){
    try{
      const d=JSON.parse(document.getElementById('bk').value);
      if(!d||!Array.isArray(d.expenses))throw new Error('formato');
      state=Object.assign({income:0,goal:0,expenses:[],plan:{}},d);
      save();tab='oggi';render();
    }catch(e3){t.textContent='Testo non valido';}
  }
});
app.addEventListener('input',e=>{
  const id=e.target.id,pair={cons:'cl100',cl100:'cons',ccons:'ccl100',ccl100:'ccons',vcons:'vcl100',vcl100:'vcons'}[id];
  if(pair){const v=num(e.target.value);document.getElementById(pair).value=v>0?String(Math.round(100/v*100)/100).replace('.',','):'';}
  if(['amt','ppl','km','cons','cl100','price','rbamt'].includes(id))updQuota();
  if(['ekm','vcons','vcl100','vprice'].includes(id))updEst();
});
app.addEventListener('change',e=>{
  if(['split','trip','fsplit','refuel','extra'].includes(e.target.id)){updQuota();return;}
  if(e.target.id==='vsel'){const v=vById(parseInt(e.target.value,10));if(!editId){document.getElementById('cons').value=fv(v.cons);document.getElementById('cl100').value=l100v(v.cons);document.getElementById('price').value=fv(v.price);}updQuota();return;}
  const id=e.target.dataset.plan;if(!id)return;
  state.plan[id]=e.target.checked;save();render();
});

async function boot(){
  try{
    const r=await api('/api/load');
    if(r.state)state=Object.assign({income:0,goal:0,expenses:[],plan:{}},r.state);
    const before=JSON.stringify(state);vehs();
    if(JSON.stringify(state)!==before)save(true);
    render();startHb();
  }catch(e){
    app.innerHTML='<div class="card"><h2>Archivio non disponibile</h2><p class="note">Il browser non permette di salvare i dati qui (navigazione privata?). Apri l’app in una finestra normale e riprova.</p><button class="btn" id="retry">Riprova</button></div>';
    document.getElementById('retry').onclick=boot;
  }
}
async function init(){
  const n=new Date();vy=n.getFullYear();vm=n.getMonth();ay=vy;
  user=getUser();
  if(!user){
    user=await askUser();
    try{localStorage.setItem(UKEY,JSON.stringify(user));}catch(e){}
  }
  app.innerHTML='<p class="note">Caricamento…</p>';
  await boot();
}
init();
</script>
</body>
</html>
